<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c17"/>
      <stop offset="100%" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131f38"/>
      <stop offset="100%" stop-color="#0a1222"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg)" />

  <!-- Studio Frame -->
  <rect x="30" y="30" width="1140" height="640" rx="12" fill="#081020" stroke="#1e3156" stroke-width="2" />

  <!-- Window Header -->
  <rect x="30" y="30" width="1140" height="52" rx="12" fill="#091224" />
  <circle cx="60" cy="56" r="7" fill="#ff5f56" />
  <circle cx="85" cy="56" r="7" fill="#ffbd2e" />
  <circle cx="110" cy="56" r="7" fill="#27c93f" />

  <!-- Title -->
  <text x="140" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="bold">
    ⚡ CMAFStreamForge Pro v1.0.0 — ISO/IEC 23000-19 CMAF &amp; Low-Latency OTT Studio
  </text>
  <rect x="990" y="44" width="160" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
  <text x="1005" y="62" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">10/10 PASS • CERTIFIED</text>

  <!-- Nav Tabs -->
  <rect x="50" y="102" width="1100" height="42" rx="8" fill="#070d1a" stroke="#1e3156" stroke-width="1" />
  <rect x="54" y="106" width="240" height="34" rx="6" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.5" />
  <text x="75" y="128" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">1. CMAF Box Inspector</text>
  
  <text x="330" y="128" fill="#8ea2c0" font-family="-apple-system, sans-serif" font-size="13">2. Latency Budget Calculator</text>
  <text x="610" y="128" fill="#8ea2c0" font-family="-apple-system, sans-serif" font-size="13">3. Dual Manifest Studio</text>
  <text x="890" y="128" fill="#8ea2c0" font-family="-apple-system, sans-serif" font-size="13">4. 10-Point Normative Auditor</text>

  <!-- Main Card: Studio Dashboard -->
  <rect x="50" y="162" width="1100" height="485" rx="10" fill="url(#cardGrad)" stroke="#1e3156" stroke-width="1" />

  <!-- Left Column: Chunk Parameters & Controls -->
  <rect x="75" y="185" width="480" height="435" rx="8" fill="#0a1324" stroke="#18294a" stroke-width="1.5" />
  <text x="95" y="215" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">CMAF Chunking Configuration</text>
  <text x="95" y="235" fill="#64748b" font-family="monospace" font-size="11">ISOBMFF / fMP4 • Chunked Transfer Encoding</text>

  <!-- Form Fields Mock -->
  <rect x="95" y="255" width="440" height="50" rx="6" fill="#0e1a30" stroke="#223964" stroke-width="1" />
  <text x="110" y="275" fill="#94a3b8" font-family="monospace" font-size="11">Chunk Duration (Target Latency):</text>
  <text x="110" y="293" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">200 ms (Industry Standard Low-Latency)</text>

  <rect x="95" y="315" width="440" height="50" rx="6" fill="#0e1a30" stroke="#223964" stroke-width="1" />
  <text x="110" y="335" fill="#94a3b8" font-family="monospace" font-size="11">In-Band SCTE-35 Cue (emsg):</text>
  <text x="110" y="353" fill="#f59e0b" font-family="monospace" font-size="12">SpliceInsert:EventID=101,Duration=30.0s</text>

  <!-- In-band Box Info Box -->
  <rect x="95" y="375" width="440" height="175" rx="6" fill="#081020" stroke="#192b4c" stroke-width="1" />
  <text x="110" y="400" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">Decoded In-Band Signaling Boxes:</text>

  <rect x="110" y="415" width="410" height="26" rx="4" fill="#0c1628" stroke="#0284c7" stroke-width="1" />
  <text x="120" y="432" fill="#38bdf8" font-family="monospace" font-size="11">[prft] NTP 64-bit Timestamp Sync (90 kHz Timescale)</text>

  <rect x="110" y="450" width="410" height="26" rx="4" fill="#0c1628" stroke="#f59e0b" stroke-width="1" />
  <text x="120" y="467" fill="#f59e0b" font-family="monospace" font-size="11">[emsg] SCTE-35 Ad Cue: urn:scte:scte35:2013:bin</text>

  <rect x="110" y="485" width="410" height="26" rx="4" fill="#0c1628" stroke="#059669" stroke-width="1" />
  <text x="120" y="502" fill="#10b981" font-family="monospace" font-size="11">[moof] Sequence #1042 • Track Fragment tfdt Decode Time</text>

  <rect x="110" y="520" width="410" height="20" rx="4" fill="#0c1628" />
  <text x="120" y="534" fill="#64748b" font-family="monospace" font-size="10">CMAF Brands: cmfc (Header) • cmfs (Chunk Media Fragment)</text>

  <rect x="95" y="565" width="440" height="38" rx="6" fill="#06b6d4" />
  <text x="315" y="589" fill="#04101e" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⚡ Synthesize CMAF Fragment Boxes</text>

  <!-- Right Column: Box Hierarchy Tree & Latency Meter -->
  <rect x="580" y="185" width="545" height="435" rx="8" fill="#0a1324" stroke="#18294a" stroke-width="1.5" />
  <text x="600" y="215" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">CMAF Box Hierarchy &amp; Latency Budget</text>
  <text x="600" y="235" fill="#64748b" font-family="monospace" font-size="11">Total Fragment Size: 33,892 Bytes • 94% Latency Reduction</text>

  <!-- Box Tree Preview Box -->
  <rect x="600" y="250" width="505" height="150" rx="6" fill="#070e1c" stroke="#172746" stroke-width="1" />
  <text x="615" y="275" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">├── [ftyp] File Type Box (Brand: cmfc, cmaf)</text>
  <text x="615" y="295" fill="#38bdf8" font-family="monospace" font-size="11">├── [moov] Movie Box (Track 1: Video avc1/hvc1 1080p50)</text>
  <text x="615" y="315" fill="#10b981" font-family="monospace" font-size="11">├── [styp] Segment Type Box (Brand: cmfs, cmaf)</text>
  <text x="615" y="335" fill="#10b981" font-family="monospace" font-size="11">├── [prft] Producer Reference Time Box (NTP Sync)</text>
  <text x="615" y="355" fill="#f59e0b" font-family="monospace" font-size="11">├── [emsg] Event Message Box (SCTE-35 SpliceInsert)</text>
  <text x="615" y="375" fill="#10b981" font-family="monospace" font-size="11">├── [moof] Movie Fragment (mfhd #1042, traf, tfdt, trun)</text>
  <text x="615" y="392" fill="#94a3b8" font-family="monospace" font-size="10">└── [mdat] Media Data Box (32,768 Bytes NAL Units)</text>

  <!-- Latency Budget Meter Card -->
  <rect x="600" y="415" width="505" height="190" rx="6" fill="#091224" stroke="#10b981" stroke-width="1.5" />
  <text x="615" y="440" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Glass-to-Glass Live Latency Comparison:</text>

  <!-- Legacy HLS Bar -->
  <text x="615" y="465" fill="#ef4444" font-family="sans-serif" font-size="11">Legacy HLS (3x 2.0s Segments): 24.0s Delay</text>
  <rect x="615" y="475" width="475" height="14" rx="4" fill="#3b1114" />
  <rect x="615" y="475" width="475" height="14" rx="4" fill="#ef4444" />

  <!-- CMAF Low Latency Bar -->
  <text x="615" y="515" fill="#10b981" font-family="sans-serif" font-size="11">CMAF Low-Latency (200ms Chunks): 0.80s Delay (94% Faster)</text>
  <rect x="615" y="525" width="475" height="14" rx="4" fill="#0b2920" />
  <rect x="615" y="525" width="30" height="14" rx="4" fill="#10b981" />

  <text x="615" y="565" fill="#64748b" font-family="monospace" font-size="10">Breakdown: Chunk 200ms + Packager 50ms + CDN 150ms + Player 400ms = 0.80s</text>
  <text x="615" y="585" fill="#06b6d4" font-family="monospace" font-size="10">Dual Manifests: LL-DASH (availabilityTimeOffset) • LL-HLS (#EXT-X-PART)</text>
</svg>
